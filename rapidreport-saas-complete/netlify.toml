# Netlify Configuration for RapidReport SaaS

[build]
  # No build command needed - static HTML
  command = ""
  # Publish directory - root contains index.html
  publish = "."

# SPA Routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=()"

# Cache static assets
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Environment variables hint (set these in Netlify Dashboard)
# SUPABASE_URL
# SUPABASE_ANON_KEY
# STRIPE_PUBLISHABLE_KEY
# API_URL
